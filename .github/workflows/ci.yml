name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build

  critical-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: zhilianbao_v2_e2e_test
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/zhilianbao_v2_e2e_test
      APP_BASE_URL: http://127.0.0.1:3000
      ADMIN_CONTACT_PHONE: 0514-XXXXXXXX
      AUTH_RATE_LIMIT_SECRET: ci-auth-rate-limit-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:critical
      - name: Upload critical E2E failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-e2e-test-results-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore

  database:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: zhilianbao_v2_test
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/zhilianbao_v2_test
      AUTH_RATE_LIMIT_SECRET: ci-auth-rate-limit-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - name: Verify repeated migrate deploy is idempotent
        run: npm run db:migrate:deploy
      - run: npm run audit:data-consistency:test
      - run: npm run db:reset:test
      - run: npm run test:database
      - name: Worker run-once smoke
        env:
          APP_ENV: test
          WORKER_RUN_ONCE: "true"
        run: npm run build:worker && npm run start:worker

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag zhilianbao-v2:m3-008 .
      - name: Verify non-root runtime image
        run: test "$(docker image inspect zhilianbao-v2:m3-008 --format '{{.Config.User}}')" = "nextjs"
      - name: Verify runtime image excludes env, source tests, and evidence artifacts
        run: docker run --rm --entrypoint sh zhilianbao-v2:m3-008 -c 'test ! -e /app/.env && test ! -d /app/tests && test ! -d /app/artifacts && test ! -d /app/src'
      - name: Verify image config contains no database or cloud credentials
        run: '! docker image inspect zhilianbao-v2:m3-008 --format "{{json .Config.Env}}" | grep -E "DATABASE_URL|SECRET_(ID|KEY)|GITHUB_TOKEN"'
      - run: docker run --rm zhilianbao-v2:m3-008 node worker-dist/main.js --help

  security:
    runs-on: ubuntu-latest
    services:
      clamav:
        image: clamav/clamav:stable
        ports:
          - 3310:3310
    env:
      APP_ENV: test
      APP_VERSION: ${{ github.sha }}
      FILE_SCAN_PROVIDER: clamav
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: 3310
      CLAMAV_TIMEOUT_MS: 5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run security:dependencies
      - run: npm run security:secrets
      - run: npm run security:code
      - run: npm run test:security
      - run: npm run test:ai-eval:contract
      - run: npm run security:clamav
      - run: npm run release:check -- --mode=ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-readiness-evidence
          path: artifacts/

  performance:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: zhilianbao_v2_performance_test
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/zhilianbao_v2_performance_test
      AUTH_RATE_LIMIT_SECRET: ci-auth-rate-limit-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:deploy
      - run: npm run test:performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-evidence
          path: artifacts/performance.json

  browser-compat:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: zhilianbao_v2_browser_test
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/zhilianbao_v2_browser_test
      APP_BASE_URL: http://127.0.0.1:3000
      ADMIN_CONTACT_PHONE: 0514-XXXXXXXX
      AUTH_RATE_LIMIT_SECRET: ci-auth-rate-limit-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:deploy
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e:compat
      - run: npm run test:e2e:weak-network
